  status: ingested
- id: bcbs-d424-cva-risk-factor-bucket-structure
  needed_by: [sa-cva-risk-factor-and-bucket-structure]
  claim: >
    That SA-CVA risk factors are grouped into the same six risk types used for the
    delta capital requirement (interest rate, foreign exchange, counterparty credit
    spread, reference credit spread, equity, commodity), each with its own buckets
    (for interest rate risk, buckets are individual currencies) and prescribed cross-bucket
    correlations (for interest rate risk, gamma = 0.5 for all currency pairs), set
    out in Section 6 "Buckets, risk factors, sensitivities, risk weights and correlations"
    (paragraphs 53 onward).
  document: 'Basel III: finalising post-crisis reforms (d424), Minimum capital requirements
    for CVA risk, Section 6 "Buckets, risk factors, sensitivities, risk weights
    and correlations" (paragraphs 53 onward)'
  expected_tier: T1
  acquisition: regulator
  status: ingested
  note: >
    NEW id. Already ingested at vault/markdown/bcbs/bcbs_d424.md; verified paragraph
    53 ("For interest rate delta and vega risks, buckets are individual currencies")
    and paragraph 54 (cross-bucket correlation gamma = 0.5) directly. regulation/bcbs-d507-cva-framework.md
    mentions only that the 2020 revisions introduced "new index buckets... for credit
    and equity risk classes", a scope-change detail rather than a treatment of the
    six-class bucket taxonomy or the cross-bucket correlation structure itself;
    that one clause is a passing mention, not coverage. The gap is a wiki article
    of the right scope, not document acquisition.
