# Sources the vault holds and the corpus has yet to draw on. One entry per
# document, in the same shape as the entries in sources/wanted.yaml.
#
# Nothing here needs finding, downloading or buying, which is why it sits apart
# from the acquisition ledger: one file mixing the two invited shopping for
# documents the vault already holds. An entry is either in-raw, meaning the
# document is extracted to vault/markdown with no wiki article written from it
# yet, or ingested, meaning the article exists and the nodes in needed_by have
# yet to cite it.
#
# acquisition: public-download | regulator | journal | purchased-personal
# status:      in-raw | ingested
#
# Those are the two of the ledger's four statuses that belong in this file.
# sources/wanted.yaml carries the whole vocabulary and is what the fragment
# contract in scripts/alchemist/ledger.py copies from. status stays on each
# record rather than being read off the file name, because check 6 skips an
# ingested entry and blocks a reviewed node on an in-raw one. Check 9 resolves
# every needed_by id here exactly as it does there.
#
# scripts/merge_ledger.py routes every entry by its status, so the split
# maintains itself: an entry whose document reaches the vault leaves the
# acquisition ledger on the next merge, and one proposed again by a later
# fragment extends the entry here rather than reappearing there.
- id: bcbs-d424-covered-bond-risk-weights
  needed_by: [covered-bond-exposure-risk-weights]
  claim: >
    The eligibility conditions (cover-pool asset classes, the 10% nominal over-collateralisation
    requirement, disclosure to investing banks) and the preferential risk-weight
    tables, by issue-specific rating or by the issuing bank's own risk weight, that
    apply to a covered bond exposure under the standardised approach.
  document: 'Basel III: finalising post-crisis reforms (d424), Standardised Approach,
    Section 5 "Covered bonds" (paragraphs 32-36)'
  url: https://www.bis.org/bcbs/publ/d424.pdf
  expected_tier: T1
  acquisition: regulator
  status: ingested
  note: >
    Confirmed present in vault/markdown/bcbs/d424.md by direct inspection: paragraph
    32 gives the covered-bond definition, paragraph 33 the eligible cover-pool asset
    classes and the 10% over-collateralisation requirement, paragraph 34 the disclosure
    requirements, and paragraph 35 the risk-weight tables for rated and unrated
    covered bonds (Tables 8 and 9). This is a different chapter from the three other
    d424 entries already ledgered (bcbs-d424-irb-risk-weight-functions for CRE31,
    bcbs-d424-sa-and-intro-provisions for the Section 4 bank-exposure hierarchy
    and implementation dates, and bcbs-d424-output-floor-capital-buffers for the
    output floor and conservation buffer), so a new id was minted rather than folding
    into any of them. No wiki article treats this span; the gap is wiki-article
    scope, not acquisition.
- id: bcbs-d424-credit-derivative-recognition
  needed_by: [credit-derivative-recognition-conditions, nth-to-default-credit-derivative-treatment]
  claim: >
    The operational requirements for a credit derivative to be recognised as credit
    risk mitigation: the minimum set of covered credit events (failure to pay, bankruptcy
    or inability to pay debts, and restructuring involving forgiveness or postponement
    resulting in a credit loss event), the partial-recognition treatment where restructuring
    is excluded, and the restriction that only credit default swaps and total return
    swaps qualify.
  document: 'Basel III: finalising post-crisis reforms (d424), Standardised Approach,
    Section 8(b)(iii)-(iv) "Specific operational requirements for credit derivatives"
    and "Range of eligible guarantors" (paragraphs 195-198)'
  url: https://www.bis.org/bcbs/publ/d424.pdf
  expected_tier: T1
  acquisition: regulator
  status: ingested
  note: >-
    Confirmed present in vault/markdown/bcbs/d424.md by direct inspection: paragraph
    195 lists the minimum covered credit events and the other operational conditions,
    paragraph 196 sets the 60% partial-recognition cap where restructuring is excluded,
    and paragraph 198 restricts recognition to credit default swaps and total return
    swaps. This is a different chapter from the three other d424 entries already
    ledgered (see the note on bcbs-d424-covered-bond-risk-weights above), so a new
    id was minted. No wiki article treats this span; the gap is wiki-article scope,
    not acquisition.


    The node's first-listed anchor is paragraph 198, within this entry's 195-198
    range, which the claim already covers on the protection-buyer side (credit risk
    mitigation recognition). Batch 27 additionally needs paragraph 89, the protection-seller
    side: a bank selling protection through a first-to-default or other nth-to-default
    basket must hold capital against the weighted sum of the referenced exposures
    up to the basket's notional. Not ledgered as a separate entry because both paragraphs
    sit in the same Standardised Approach chapter of the same document.
- id: bcbs-d424-cva-delta-vega-hedge-recognition
  needed_by: [sa-cva-hedge-recognition]
  claim: >
    That the SA-CVA capital requirement is calculated as the sum of the capital
    requirements for delta and vega risks calculated for the entire CVA portfolio,
    including eligible hedges (paragraph 41), with delta risk summed across six
    risk types and vega risk across five (paragraphs 42 and 44), and a hedging disallowance
    parameter R of 0.01 applied within the bucket-level aggregation to prevent perfect
    hedging of CVA risk from eliminating the charge (paragraph 50-51).
  document: 'Basel III: finalising post-crisis reforms (d424), Minimum capital requirements
    for CVA risk, Section 5 "Calculations" (paragraphs 41-52)'
  expected_tier: T1
  acquisition: regulator
  status: ingested
  note: >
    NEW id. Already ingested at vault/markdown/bcbs/bcbs_d424.md; verified paragraphs
    41, 42, 44 and 50-51 directly. regulation/bcbs-d507-cva- framework.md, the vault's
    only SA-CVA wiki article, states SA-CVA is "a sensitivities-based capital calculation
    modelled on the FRTB standardised approach... with an aggregate multiplier m_CVA
    = 1", which covers the node's multiplier clause but never states the delta/vega
    split or the hedge-netting mechanism the node's body actually describes; its
    hedge-recognition discussion is about BA-CVA's full version (a different approach,
    with its own β parameter), not SA-CVA. Direct read of the primary source confirmed
    the wiki gap rather than assumed it. The gap is a wiki article of the right
    scope, not document acquisition.
