  claim: >
    The ASSA F107 banking syllabus as a whole. Thirty-eight batches drew on it across 177
    nodes, which between them reach every part of the subject: the bank business models and
    the retail, corporate and investment banking product sets; the balance sheet, income
    statement and the ratios read off them; pricing, from the discounted-cashflow model and
    its assumptions through risk-based, marginal and transactional pricing to funds
    transfer; credit, market, operational, liquidity, business and residual risk with the
    techniques each is quantified by; capital adequacy, its regulatory and economic measures
    and the Basel II and III requirements behind them; liquidity regulation, the LCR and
    NSFR and the behavioural modelling they rest on; and the regulators, resolution regimes
    and compliance obligations a bank operates under.

