# Sources the corpus needs and the vault does not hold. One entry per document.
#
# The ledger drains rather than accumulates, because no node reaches
# status: reviewed while an open entry lists it in needed_by (check 6).
#
# acquisition: public-download | regulator | journal | purchased-personal
# status:      wanted | located | in-raw | ingested
#
# purchased-personal is a last resort. Where an entry uses it, it also records
# the public primary source those notes were distilled from, and that primary
# source is what the node eventually cites.
- id: ifoa-cm1-core-reading-2026
  needed_by: [conditional-probability]
  claim: >
    The standard actuarial notation for annuity-certain values and the
    equation-of-value formulation.
  document: "IFoA CM1 Core Reading, 2026"
  url: null
  expected_tier: T4
  acquisition: purchased-personal
  primary_alternative: "McCutcheon and Scott, An Introduction to the Mathematics of Finance"
  status: wanted
- id: renshaw-verrall-1998-glm-claims-reserving
  needed_by: [chain-ladder, over-dispersed-poisson-model]
  claim: >
    That the chain ladder reserve estimates coincide with the maximum
    likelihood estimates of an over-dispersed Poisson generalised linear model
    with a log link and additive origin and development effects.
  document: "Renshaw, A.E. and Verrall, R.J. (1998), A stochastic model underlying the chain-ladder technique, British Actuarial Journal"
  url: null
  expected_tier: T4
  acquisition: journal
  status: wanted
  note: >
    The claim itself is already citable through
    england-verrall-2002-stochastic-claims-reserving, which the vault holds at
    T4 public-free and which states it at sections 2.2.1, 2.3.4 and 7.2.14.
    This entry is for the primary rather than the survey, and a node may reach
    status drafted on the survey alone.
