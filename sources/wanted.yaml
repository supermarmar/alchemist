    on contingent events (providers-of-financial-products), and the considerations
    behind placing a value on a provision (provision-valuation-considerations).


    Batch 33 needs six further CP1 chapters: methods for aggregating separately
    measured risks allowing for their interaction (3.4-3); how risk and capital
