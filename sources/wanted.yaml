    estimates (graduation-rationale, graduation-by-parametric-formula, graduation-by-spline-function,
    graduation-by-standard-table, grouping-of-signs-test, graduated-estimates-test-adjustment,
    anchors cs2.4.5-1 to cs2.4.5-7). The vault holds no content on graduation, grouping
    of signs, or the generalised Pareto distribution at all.


    Batch 19 needs CS2 section 2.1-1 for an integrated, I(1), time series and the
    order-of-integration concept. No vault article treats unit roots or series integration;
    confirmed by index and full-text grep.


    Batch 21 needs two further CS2 sections distinct from this id's proportional-hazards
    claim: k-means clustering, and the forward and backward Kolmogorov equations
    for a Markov process's transition probabilities.


    This batch's three nodes need CS2's future-lifetime-random-variable material
    rather than the survival-analysis topics the existing claim names: the integral
    expressions for tpx and tqx in terms of the force of mortality, the consistency
    condition requiring future lifetimes defined at different starting ages to agree
    with each other, and the lifetime distribution function as the cumulative distribution
    function of the future lifetime random variable (tqx). The vault's credit and
    LGD survival-analysis articles use "hazard" and "survival function" in specific
    applied credit-modelling contexts and were considered but not attached, since
    none states these general actuarial definitions.


    Batch 23 needs two further CS2 chapters: choosing a distribution to represent
    the size of an individual claim, as distinct from the total-portfolio half the
    vault covers via methods/aggregate-loss-models (loss-distribution, CS2 1.1-1;
    also anchored up.wst322.2); and fitting a chosen loss or failure-time distribution
    by maximum likelihood and by the method of moments on both complete and incomplete
    data, comparing the two (loss-distribution-parameter-estimation, CS2 1.1-5).
    The vault's nearest content, methods/lgd-survival-analysis, fits Cox and Kaplan-Meier
    survival curves to censored recovery data, a different estimation technique
    for a different quantity.


    Batch 24 needs two further CS2 chapters beyond the claim above: the mortality-law
    chapter (4.1, Makeham's law) and the full stochastic- processes chapter (3.1
