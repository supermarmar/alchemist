  claim: >
    The actuarial control cycle and the general process of specifying, solving and
    monitoring an actuarial problem: the range of problem-solving approaches available,
    how a model is constructed and applied, the business roles in which actuaries
    advise, and how actual experience is compared against what was expected.
  document: IFoA CP1 Core Reading, 2026
  expected_tier: T4
  acquisition: purchased-personal
  primary_alternative: Booth, P., Chadburn, R., Cooper, D., Haberman, S. and James,
    D., Modern Actuarial Theory and Practice
  status: wanted
  note: >
    Extends the seeded claim with three further CP1 chapters: identifying where
    a provider's surplus or profit has come from and the management actions available
    to control it, the investment and matching principles that govern how a provider's
    assets are held against its liabilities, and the principles behind choosing
    assumptions, covering what information is available, how useful each source
    is, and the degree of prudence called for.


    Extends the seeded claim with the adjacent CP1 risk-identification chapter:
    the risk factors affecting the level, timing and security of a contingent-event
    benefit payment.


    Extends the seeded claim with two further CP1 chapters: how provisioning and
    regulatory capital requirements feed into a provider's pricing and financing
    strategy (section 4.3), and how a provider meets, manages and matches its capital
    requirements over time, including the tools for managing capital and profitability
    together (sections 4.8 and 5.1).


    Extends the seeded claim with two further CP1 chapters, neither the control
    cycle: the categories of contingent-event product and benefit and how each is
    structured for its stakeholders (section 1.2), and how the cost of a contingent-event
    benefit and the contributions charged to meet it are determined (section 4.3).


    Batch 14 needs two further CP1 sections not named in the seeded claim: expense
    allowance and allocation (section 4.2-3) and external business environment forces
    (section 2.2-1).


    Batch 15's financial-institution-regulatory-role needs CP1 module 2.1-2, the
    role major financial institutions play in the wider regulatory and business
    environment, a different part of the same document from the existing claim's
    control-cycle scope.


    Batch 19 needs two further CP1 sections: 2.1-3 for information asymmetry between
    a financial services provider and its customer, and 1.2-3 for the core pooling
    and funding principles behind insurance and pensions. Both surfaced only passing
    mentions in the vault (a clause on information asymmetries inside resolution-disclosure
    and securitisation-transparency articles); neither is a treatment of the concept
    itself.


    Batch 20 needs five further CP1 investment sections, none named in the existing
    claim: 2.3, the defining features of the principal investment asset classes
    and the markets they trade in; 4.6-5 and 5.2-2, monitoring a portfolio's performance
    against a benchmark; 4.4-3, the theoretical relationships between an asset's
    total return and its components; 4.6-3, setting a risk budget for a portfolio;
    and 4.4-2 and 4.4-4, the methods used to value individual investments and portfolios
    of them.


    liability-valuation needs a different part of CP1: why a provider values the
    benefits arising from a financial product, and how the reason for the valuation
    shapes the choice of methodology and assumptions used. The vault's Solvency
    II technical provisions article treats one specific valuation regime in depth,
    best estimate plus risk margin, but not the general purpose-driven principle
    the node states, so it was considered and not attached.


    Batch 24 needs CP1's market-consistent-valuation chapter (4.5, also anchored
