- id: holford-1983-age-period-cohort
  needed_by: [age-period-cohort]
  claim: >
    The age-period-cohort identification problem: that a panel indexed by an entity's
    age, the calendar period and its cohort can identify at most two of the three
    without an external constraint, because the third is always their sum.
  document: Holford, T.R. (1983), The estimation of age, period and cohort effects
    for vital rates, Biometrics 39(2), 311-324
  expected_tier: T4
  acquisition: journal
  status: wanted
  note: >
    The node's own anchor, ucsc.dl-actuarial-2026.l01, does not cover this: that
    lecture (vault markdown/courses/2026_eth_deep-learning-actuarial-01-use-case.md)
    is an actuarial pricing worked example (EDA, a GLM, a GBM) and contains no age-period-cohort
    content, so the anchor looks mismatched against this node. The vault's methods/breeden-2016-lifecycle-environment-loan-level-forecasts
    treats a credit-modelling instance of the same confounding (age, vintage and
    environment terms), but frames it as an estimation challenge on short portfolio
    histories rather than stating the general identification result, so it was judged
    too applied to attach. Holford (1983) is the standard reference for the identification
    result itself.
