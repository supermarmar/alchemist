    with-replacement case), the condition under which two random variables carry
    no information about each other, and the vocabulary a hypothesis test is built
    from (null/alternative hypothesis, Type I/II error, test statistic, critical
    region, significance level, p-value, power).


    Batch 20 needs section 2.1-5, the inverse transform method for generating a
    sample from a distribution by applying its inverse distribution function to
    a uniform random number, distinct from the analysis-of-deviance and MLE asymptotics
