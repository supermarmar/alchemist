    intervals) in a named section, but does not treat the risk that a past trend
    simply does not continue as its own distinct error source, which is the remainder.


    Batch 26 needs four further CS2 chapters: the moving average time-series process
    and its always-stationary property, the multi-state model extending the two-state
    mortality model to several named states, the vector extension of an autoregressive
