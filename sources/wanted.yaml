    own confidence-interval content in methods/pluto-tasche-pd-estimator,
    methods/discrimination-metrics-auc-and-somers-d and similar validation methods was
    rejected: each applies a confidence bound to a specific credit-risk estimation problem,
    a one-sided binomial upper bound for low-default-portfolio PDs or a cluster-jackknife
    interval for a rank discrimination statistic, rather than teaching the general normal-
    approximation construction. See report-08.md.

    For the three GLM nodes, methods/exponential-dispersion-family-and-glm was rejected: it
    defines deviance as a fitting criterion and names Fisher scoring and IRLS in one clause,
    without treating residual diagnostics, the chi-square or likelihood-ratio goodness-of-
    fit tests, or the interpretation of software output.

    For the linear combination and regression nodes, the vault's Vasicek and CreditMetrics
    articles were rejected because each uses a linear combination for a specific latent-
    variable credit-risk construction without stating the general result, and the OLS risk-
    factor-encoding article was rejected because it names linear regression once as a given
    tool inside a categorical-encoding argument.

