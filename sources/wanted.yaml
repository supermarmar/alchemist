  note: >
    Extends the seeded claim with a different CS2 chapter than the survival-analysis
    topics it names: the Archimedean copula family (Clayton, Gumbel and Frank generator
    functions and their characteristic upper and lower tail-dependence patterns),
    and the autoregressive, moving-average and ARIMA time series process definitions,
    order and stationarity conditions (the characteristic equation's roots lying
    outside the unit circle). The vault's methods/forward-looking-information-modelling
    applies an AR(1)/ARIMA(1,0,0) model to IFRS 9 forward-looking-information regression
    and its small-sample estimation bias, but does not teach the general process
    definitions, order or stationarity theory these four nodes need; see report-02.md.


    Extends the seeded claim with a third CS2 chapter, distinct from both the survival-analysis
    topics named in the original claim and the time-series topics an earlier batch
    added: the bias-variance trade-off, and the metrics used to evaluate a binary
    classifier, including precision, recall, F1 and the ROC curve.


    Extends the seeded claim with the general copula definition at CS2 section 1.3
    (ifoa.cs2.1.3-1), the same section an earlier batch already ledgered for the
    sibling node archimedean-copula (ifoa.cs2.1.3-3). The vault's methods/default-correlation-copula-models
    was considered and rejected for this node: it states what a copula does functionally
    inside Li's credit-derivative argument (joining marginal survival distributions
    calibrated to bond spreads, and the normal-copula/asset-correlation equivalence)
    but never gives the general definition itself: no Sklar's theorem, no construction
    from uniform marginals, no survey of copula families beyond the normal case.
    A page drafted from it would be a credit-correlation page, not the general copula
    node this corpus needs; see report-08.md.


    Batch 14 needs two further CS2 sections not named in the seeded claim: expectation
    of life (section 4.1-7) and experience rating as a Markov chain (section 3.2-3).


    Batch 15's filtered-time-series needs CS2 module 2.1-3, the linear filter and
    stationary time series section, a different part of the same document from the
    existing claim's survival-analysis scope.


    Batch 16 needs CS2's future lifetime random variable section (4.1-1) and its
    generalised extreme value distribution section (1.4-1, also cross-referenced
    at up.wst322.7, a course not otherwise anchored in this batch). Distinct from
    the seeded claim's proportional-hazards ground.


    This batch needs several distinct CS2 sections: goodness-of-fit measures for
    a fitted loss distribution (goodness-of-fit-assessment, anchor cs2.1.1-6); the
