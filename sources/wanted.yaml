  status: wanted
  note: >
    The document is needed whole rather than by section, which is what 177 nodes across the
    subject's every chapter means. Per-node reasoning, including every candidate considered
    and why each rejected one lost, is in the batch reports under notes/phase-2-reports/;
    .staging/phase-2/manifest.yaml maps a node id to its batch.

    Three attachment decisions are recorded here rather than left to the reports, because
    each rejected a vault article that a later reader would otherwise reach for. For
    contingency funding obligation modelling, methods/ifrs9-ead-ccf-modelling and the LCR's
    partial-drawdown clause in regulation/bcbs-liquidity-coverage-ratio-original were both
    rejected: the former models drawdown for IFRS 9 credit-loss provisioning rather than for
    liquidity-stress funding obligations, and the latter names the drawdown as one clause
    among several stress assumptions without treating how it is modelled. For corporate loan
    pricing, concepts/economic-value-of-rating-systems was rejected: it treats grade-based
    risk-adjusted pricing as a portfolio mechanism rather than the corporate segment's
    practice of pricing each loan through individual negotiation. See report-08.md.

    For prepayment risk, the vault's IRRBB material was rejected: it treats prepayment as a
    behavioural modelling input feeding EVE and NII rather than as a defined risk category
    with the income and reinvestment framing the node needs. See report-30.md.

    For the EU recovery and resolution regime, the vault's UK bank resolution article was
    rejected: it mentions the Bank Recovery and Resolution Directive in one clause on the UK
    regime's transposition history and does not treat the EU regime itself.

