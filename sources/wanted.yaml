- id: bcbs-d424-irb-purchased-receivables
  document: 'Basel III: finalising post-crisis reforms (d424), IRB approach, purchased
    receivables: classification (paragraph 27), risk-weight approach (paragraph
    129), credit risk mitigation (paragraph 140), and risk quantification standards
    (paragraph 265)'
  expected_tier: T1
  acquisition: regulator
  status: wanted
  claim: >
    The treatment of a purchased receivables pool under the IRB approach: classification
    as retail or corporate according to the underlying obligor, with a top-down
    pool-level default-risk estimate available for corporate receivables and full
    or partial seller recourse not by itself disqualifying a pool from that treatment;
    the risk-weight approach, drawing on the relevant asset class's risk-weight
    function where a bank can rate the receivable that way and otherwise applying
    the pool's estimated default-weighted loss rate as a combined PD and LGD; the
    recognition of collateral, guarantees and credit derivatives on the pool using
    broadly the corporate or retail credit risk mitigation framework, adjusted for
    the pool structure; and the risk quantification standards requiring sufficiently
    homogeneous pooling, effective monitoring of the receivables' quality and the
    seller's financial condition, and demonstrated reliance on advances being repaid
    under all foreseeable circumstances.
  needed_by: [purchased-receivables-classification, purchased-receivables-crm, purchased-receivables-risk-quantification-standards,
    purchased-receivables-risk-weight-approach]
  note: >
    One ledger entry for four closely related paragraphs of the same IRB purchased-receivables
    section, rather than four separate entries, following the brief's rule against
    inflating the ledger with one document split across many entries. The vault's
    eba-irb-material-model-changes-rts article names "purchased receivables" once,
    in the unrelated context of which model changes require prior notification,
    and the vault's regulation/irb-approach overview does not mention purchased
    receivables at all, so neither was attached.
