  claim: >
    The adjustment coefficient as a parameter of the surplus process that bounds
    the probability of ruin from above through Lundberg's inequality, and how the
    retention level under proportional or excess of loss reinsurance is chosen to
    maximise it.
  document: IFoA CM2 Core Reading, 2026
  expected_tier: T4
  acquisition: purchased-personal
  primary_alternative: Dickson, D.C.M., Insurance Risk and Ruin
  status: wanted
  note: >
    Extends the seeded claim, which does not cover these two topics: the definitions
    of arbitrage and of a complete market in which every payoff can be replicated
    by trading the assets available, and the practical difficulties of estimating
    an asset pricing model's inputs, such as expected returns, variances and factor
    sensitivities, from limited historic data.


    Extends the seeded claim with a different CM2 chapter than the adjustment coefficient
    and ruin theory: option pricing, covering the binomial option pricing model,
    the Black-Scholes partial differential equation and its martingale solution,
    the validity of the model's assumptions, and valuing an embedded benefit guarantee
    by simulating the underlying asset.


    Extends the seeded claim with two further CM2 chapters, neither reinsurance-related:
    the capital asset pricing model (section 3.2), and Brownian motion as the continuous-time
    process underlying the module's stochastic finance content (section 3.4).


    Batch 14 needs a different CM2 section from the seeded claim: section 1.2-2,
    the expected utility theorem, rather than the adjustment coefficient.


    Batch 15's fat-tailed-return-distribution needs CM2 module 2.1-4, the fat-tailed-distribution
    treatment, a different part of the same document from the existing claim's adjustment-coefficient
    scope.


    Batch 16 needs CM2's forward contract valuation section (5.1-3, also cross-referenced
    at ifoa.sp6.2.2) and its geometric Brownian motion section (3.4-5). Distinct
    from the seeded claim's ruin-theory ground.


    hull-white-model carries a second anchor into CM2 (ifoa.cm2.3.5-5) alongside
    its two SP6 anchors, for the Vasicek-to-Hull-White extension step specifically.
    Not the ruin-theory chapter the seeded claim names.


    Batch 19 needs three further CM2 sections beyond the adjustment-coefficient
    claim already on file: 4.2-3 for the inflation-adjusted chain ladder, 1.2-7
    for the expected-utility treatment of an insurance premium, and 2.2-1 for risk
    pooling as risk transfer. None of the three is covered by any vault article;
    confirmed by index and full-text grep across wiki/.


    Batch 21 needs CM2's treatment of Ito's lemma (stochastic calculus), a different
    section from the adjustment coefficient claim this id already carries.


    Batch 23 needs a different CM2 chapter: modelling a security's price as log-normally
    distributed at any future date, and the empirical evidence for and against the
    model (lognormal-security-price-model, CM2 3.4-1). The vault's only geometric-Brownian-motion
    content is a Merton-style credit portfolio loss model, a different application.


    Batch 24 needs three further CM2 chapters beyond the ruin-theory claim above:
    the portfolio-theory chapter (3.1, mean-variance optimisation, also anchored
    to University of Pretoria WTW354.1 as a secondary body not given its own entry
    here), the stochastic-process chapter (3.4, mean-reverting processes) and the
    martingale chapter (5.3, the martingale representation theorem, also anchored
    to IFoA SP6.3.3-7 as a secondary body).


    Batch 25's node (CM2 2.2-2) needs moral hazard and adverse selection as insurance
    information asymmetries. The vault covers adverse selection extensively but
    only as an IRB credit-pricing effect (methods/heterogeneity-shortfall-impact
    and others); moral hazard does not appear anywhere in the vault, so neither
    term of this two-part node was attached.


    Batch 26 needs a further CM2 chapter: the multifactor model explaining an asset's
    return from several sources of systematic risk, and the distinction between
    macroeconomic, fundamental and statistical factor models (shared with the SP5
    anchor above).


    Batch 28 needs three further CM2 chapters this claim does not cover: the standard
    option Greeks (chapter 5.3, carrying two further anchors at ifoa.sp6.4.2-1 and
    ifoa.sp6.4.2-3 not separately ledgered per the brief's multi-anchor rule); the
    no-arbitrage upper and lower bounds on a European or American option price and
    the determinants of option price (chapter 5.1, the determinants node carrying
    a second anchor at ifoa.sp6.3.1); and the Ornstein-Uhlenbeck stochastic differential
    equation for a mean-reverting process (chapter 3.4).


    Batch 29 needs CM2 module 4.1, the Poisson process as a counting process for
    events arriving independently at a constant rate with exponentially distributed
    inter-arrival times, a different part of the same document from the existing
    claim's ruin-theory scope. The node also anchors to ifoa.cs1.2.1-4, ifoa.cs2.3.3-2,
    up.wst211.10 and up.wst312.13; represented here under its first-listed anchor
    per the ledger-04.yaml precedent for multi-anchor nodes.


    Batch 30's probability-of-ruin node needs the general treatment this claim's
    Lundberg's-inequality bound is itself built on: the probability that an insurer's
    surplus falls below zero, considered over a finite or infinite time horizon
    and in continuous or discrete time, and estimated by simulation where no closed
    form exists. The node also carries a secondary anchor (ifoa.sp9.5.1-3) not ledgered
    separately, since CM2 is the first-listed anchor body.


    Batch 31 needs the no-arbitrage put-call parity relationship, linking a European
    call to the corresponding put through the underlying price and the present value
    of the strike, a separate CM2 section from the adjustment coefficient already
    recorded.


    Batch 32 also wants, as a partial-coverage remainder, the CM2 unit setting out
    the assumptions common to the chain ladder, average cost per claim and Bornhuetter-Ferguson
    reserving methods, and what breaks each when the assumption fails (reserving-method-assumption,
    anchor ifoa.cm2.4.2-7). The vault's methods/chain-ladder-reserving and methods/bornhuetter-ferguson-reserving
    are attached to this node and cover the chain ladder's and Bornhuetter-Ferguson's
    own assumptions in depth, but neither treats the average cost per claim method,
    and neither states the three methods' assumptions as a single comparative synthesis.


    Batch 33 needs the CM2 chapter classifying an investor as risk averse, risk
    neutral or risk seeking from utility function curvature, and the Arrow-Pratt
    coefficients of absolute and relative risk aversion (1.2-3).


    Batch 34 needs five different CM2 sections on investment risk measures and risk-neutral
    valuation, none the existing claim's ruin-theory scope. risk-measure-comparison
    (2.1-3) and risk-measure-utility- relationship (2.1-2) need the general treatment
    of VaR, TVaR, shortfall probability and semi-variance against each other and
    against utility theory; checked the vault index and full text for "semi-variance",
    "shortfall probability", "value at risk" and "utility function" and found no
    general finance treatment, only the credit-VaR used inside concentration-risk
    quantification. risk-neutral-bond- pricing (3.5-4, plus sp6.3.7-4), risk-neutral-pricing-measure
    (5.2-2, plus sp6.3.2-8) and risk-neutral-versus-real-world-measure (5.2-3, plus
    sp6.3.4-3) each need the derivatives-pricing theory of the risk-neutral measure
    (the martingale property, the measure change, the contrast with the real-world
    measure); the vault's xVA and CVA articles use "risk-neutral expectation" as
    one clause describing what CVA measures, never teaching the measure or its construction,
    so none of the three clears the bar.


    Batch 35 needs chapter 2.1-1 (shortfall probability) and chapters 3.3-2 and
    3.3-5 (the single-index model), different chapters from the recorded adjustment-coefficient
    claim.


    Batch 36 needs three further CM2 chapters: a utility function whose shape depends
    on a state of the world beyond wealth alone, such as health or employment status;
    pricing a payoff by discounting it with a state-price deflator rather than a
    risk-neutral measure, and showing the two approaches equivalent in both the
    binomial and Black-Scholes settings; and the stochastic differential equation,
    describing how a quantity evolves through a deterministic drift term and a random
    diffusion term driven by Brownian motion, of which the Ito integral gives the
    rigorous meaning. Stochastic differential equation carries a further anchor
    body (ifoa.sp6.3.3-2), which this entry departs from since CM2 is the node's
    first-listed anchor and the more foundational treatment. No vault article was
    found treating Brownian motion, the Ito integral or a stochastic differential
    equation at all, confirmed by full-text grep across the whole wiki.


    Batch 37 needs the model of an insurer's aggregate claims and cashflow over
    time from which the surplus at any date is written down (surplus-process, 4.1-1),
    a separate CM2 section from the adjustment-coefficient claim already recorded.


    two-state-credit-rating-model needs CM2 Unit 3.6's credit risk modelling coverage
    (CM2.3.6-4, the reduced-form performing/defaulted model at constant transition
    intensity), a different unit from the seeded claim's ruin-theory ground.


    Extends the existing needed_by with utility functions (CM2 section 1.2) and
    the Vasicek interest rate model (CM2 section 3.5). vasicek-interest-rate-model
    carries a second anchor, ifoa.sp6.3.7-3, not separately ledgered.
