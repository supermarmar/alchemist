    here), distinct from the actuarial-control-cycle claim above. The vault's `concepts/market-consistent-embedded-value`
    treats a specific life-insurance metric (MCEV) rather than the general valuation
    technique; see report-24.md.


    Both this batch's nodes anchor to the same section, CP1 4.2-2: the regional,
    social and economic drivers of mortality and morbidity variation, and the tendency
    for initially distinct groups' mortality experience to converge as they age.
