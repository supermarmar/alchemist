  claim: >
    The techniques a bank uses for anti-money-laundering and sanctions compliance,
    how advisory services such as M&A advice are priced, the alternative-bank business
    model, and the techniques banking risk quantification shares with insurance.
  document: ASSA F107 Study Material, 2026
  expected_tier: T4
  acquisition: purchased-personal
  primary_alternative: Van Greuning, H. and Bratanovic, S.B., Analyzing Banking
    Risk (World Bank)
  status: wanted
  note: >
    Extends the seeded claim, which does not cover these two topics: how an equity
    analyst weighs a bank's capital strength against the drag it places on shareholder
    returns, and how a bank revises the pricing of its assets and liabilities as
    market conditions and its own funding position change over time.


    Extends the seeded claim with three further F107 topics: the basic indicator
    approach to operational risk capital, the basis risk that arises when assets
    and liabilities are priced off different reference rates, and the periodic behaviouralisation
    exercise that re-estimates a bank's behavioural tenor assumptions against fresh
    data.


    Extends the seeded claim with three further F107 topics: the risk that a bank's
    earnings fall short because of adverse changes in its volumes, margins or costs
    (section 1.12-15); how much capital regulation itself requires a bank to hold,
    as one input among several to the board's own judgement of adequate capital
    (section 9.3); and distributing a bank's finite capital across business lines
    by risk and return (section 3.4).


    Extends the seeded claim with three further F107 topics: modelling how much
    of a bank's undrawn committed facilities and other contingent funding lines
    would actually be drawn in a stress (section 10.2); the lending, cash management
    and trade finance products offered to corporate customers (section 1.6); and
    how a bank prices a corporate loan, typically negotiated individually against
    the borrower's own credit standing (section 5.3). For the first, the vault's
    methods/ifrs9-ead-ccf-modelling and the LCR's "partial drawdown of committed
    credit and liquidity facilities" clause in regulation/bcbs-liquidity-coverage-ratio-original
    were both considered and rejected: the former models drawdown for IFRS 9 credit-loss
    provisioning rather than liquidity-stress funding obligations, and the latter
    names the drawdown as one clause among several stress assumptions without treating
    how it is modelled. For the third, the vault's concepts/economic-value-of-rating-systems
    was considered and rejected: it treats grade-based risk-adjusted pricing as
    a portfolio mechanism, not the corporate segment's practice of pricing each
    loan through individual negotiation; see report-08.md.


    Extends the seeded claim with nineteen further F107 topics clustered around
    three chapters. Chapter 5.4, the discounted cashflow loan pricing model: the
    six income, cost, expected-credit-loss, funding/FTP and capital-required assumptions
    that feed it, and its three uses (risk-based pricing, marginal pricing/contribution
    to overheads, and lifetime ROE/RAROC). Chapter 6.1, default events applied to
    cross-border and specialised lending. Chapter 10, liquidity: defining liquidity
    itself, deposit behavioural tenor, the factors determining a deposit's liquidity
    value, the deposits analysis template, and deposit insurance regulation. Chapter
    5.2, deposit pricing considerations, and chapter 1.11, deposit taking as a business.
    Chapter 5.5, the circumstances in which a derivative pricing model's assumptions
    break down. None of this batch's own vault searches found a wiki article treating
    any of these F107-specific topics; they sit in general banking business and
    pricing practice, which the vault's credit-risk and regulatory research does
    not cover at this operational depth.


    Batch 14 needs four further F107 sections not named in the seeded claim. Section
    10.4-2-4/2-5: worked liquidity coverage ratio calculations and the specific
    run-off percentages behind them; the vault holds the LCR's formula and structure
    (BCBS 188) but no worked figures, so these two nodes are logged together as
    one gap rather than an acquisition gap for the ratio's definition. Section 1.12-16:
    environmental, sustainability and governance risk as a bank risk category; the
    vault's climate-risk-management article, attached to esg-risk, covers only the
    environmental/climate third of this section, so the sustainability and governance
    thirds remain a gap. Section 7.7-2: expected shortfall's own tail-average definition;
    the vault's FRTB article, attached to expected-shortfall, covers only the regulatory
    application (why ES replaced VaR in market risk capital), not the measure's
    definition itself.


    Batch 15's fair-value-accounting needs F107 module 1.9-5, defining fair value
    accounting as carrying assets and liabilities at current market value rather
    than historical cost, a different part of the same document from the existing
    claim's AML/advisory-pricing scope.


    Batch 16 needs five further F107 sections, distinct from the seeded claim's
    AML/advisory-pricing/alternative-bank ground: forward contract pricing (5.5-4-2),
    forward rate agreements (7.5-4-1, also cross-referenced at ifoa.sp6.2.5-7),
    frequency/severity modelling for credit and operational risk (3.5-1), futures
    (7.5-4-2), and the outlook for GDP and expected credit losses (9.3-6).


    This batch needs F107's credit risk mitigation section on guarantees (anchor
    f107.6.1-6-5), a different part of the syllabus than the AML/advisory-pricing/alternative-bank
    section this id's existing claim names. It is ledgered here as the remainder
    of a partial attachment: regulation/crr-credit-risk-provisions covers the EU-transposed
    substitution approach; see also the new bcbs-d424-irb-guarantee-substitution
    entry for the Basel IRB-approach remainder.


    Two further F107 chapters, neither the AML/advisory-pricing chapter the seeded
    claim names: hedging as an offsetting position taken across the bank, and why
    an exposure can be accounting-impaired without being in regulatory default (or
    the reverse), since the two tests answer different questions.


    Batch 19 needs three further F107 sections: 10.1-3-6 for the inter-entity lending
    report and 7.1-2 for interbank reference rates, neither of which has any vault
    content beyond passing "interbank" mentions in an LGD-discount-rate article;
    and 7.1-3 for the duration and basis-point-value metrics that measure a bank's
    interest rate sensitivity. The node is attached against `concepts/eve-and-nii`
    for the EVE/NII sensitivity framework and `methods/alm-immunisation` for duration
    matching (Redington's conditions), but basis point value itself is not named
    in any vault article, so the section stays ledgered as a partial remainder.


    Batch 20 needs six further F107 sections, none named in the existing claim:
    6.1-2.4, the check that a bank's internal rating lines up with a borrower's
    external rating, and the explanation required where the two diverge; 1.5-3,
    the definition of an investment bank; 4.2, the products an investment bank offers;
    1.6-3, investment banking activities; 5.3-3, how an investment bank prices a
    loan within a transaction such as acquisition finance; and 5.5-1, an overview
    of investment banking.


    Batch 21 needs two further F107 sections distinct from this id's existing claim:
    how the LCR's liability treatment feeds a bank's funding strategy, and the specific
    numeric run-off rates the LCR applies by liability type. The vault's bcbs-188
    article covers the outflow assumption's general shape (idiosyncratic and market-wide
    shocks by liability category) but not the numeric run-off table, so lcr-outflow-assumptions
    is attached with this remainder still open.


    lending-exposure-legal-entity needs a different part of F107: recording and
    measuring a bank's credit exposure against the specific legal entity that owes
    it, rather than against a trading name or brand. The vault's large-exposures
    connected-clients articles cover a related but distinct topic, aggregating exposure
    across a group of connected clients, and do not use "legal entity" language
    on direct inspection.


    Batch 23 needs six further F107 chapters: a general definition of liquidity
    risk distinct from solvency risk (liquidity-risk, F107 1.12-2 and 3.2-5); the
    generic concept of a liquidity risk factor applied to an asset or funding line,
    beyond the specific LCR haircuts and run-off rates the vault states (liquidity-risk-factor,
    F107 10.1-3-4); the effective/behavioural maturity a bank assigns a loan from
    prepayment behaviour (loan-behavioural-tenor, F107 10.3-2); the loan-to-deposit
    ratio (loan-to-deposit-ratio, F107 10.1-3-1); loan underwriting criteria (loan-underwriting-criteria,
    F107 3.4-1); and the expert-judgement and independent-validation requirements
    for an operational risk loss distribution model given thin tail data (loss-distribution-approach-validation,
    F107 8.3-2-1-1).


    Batch 24 needs three further F107 chapters beyond the claim above: the market-and-funding-risk
    interaction section (7.5-3), the market-implied-survival-curve section (3.5-4
    and 6.3-5-1), and the general market-risk chapter (1.12-7, 3.2-2 and 7.5-1,
    also anchored to IFoA SP5.4.1-2, SP6.4.4-1 and SP9.3.2-1 as secondary bodies
    not given their own entries here).


    Batch 25 needs three further sections of this document. For ml-in-banking-risk-management
    (F107 3.5-8), the vault covers ML for credit decisions (attached: methods/ml-credit-risk-methods)
    but not ML for fraud detection or other banking risk-management tasks, which
    is the remainder this document would close. For model-control-cycle (F107 3.5-9),
    the recurring specify-monitor-revise cycle for a risk model; the closest vault
    content (PRA SS1/23's five governance principles) frames periodic revalidation
    as one principle among five rather than as this cycle, so it was not attached.
    For money-supply-and-monetary-policy (F107 1.1-2), how bank lending and deposit-taking
    expand the money supply and the channel through which central bank policy acts
    on it.


    Batch 26 needs four further F107 chapters this claim does not cover: the mutual-bank
    ownership structure, the layer of national regulation and guidance a national
    regulator adds on top of supra-national standards, net interest income's behaviour
    over the economic cycle and the net interest margin and spread ratios, and mitigating
    risk through future new-business volume or mix rather than through hedging or
    asset sales.


    Batch 27 needs fourteen further F107 sections this claim does not describe:
    non-interest revenue (1.7-2); qualitative factors in non-retail credit assessment
    (6.1-1-2); observed-versus-normal return distributions for VaR (7.7-1); NSFR
    compliance actions (10.4-3-2); on-balance-sheet deposit-loan netting (6.1-6-6);
    and the operational risk loss-database chapter (8.1 through 8.3), covering loss
    event types, loss amounts and dates by type, event grouping, correlation and
    dependence between loss types, data integration of internal, external and scenario
    data, distributional assumptions, and the loss event as the database's basic
    recording unit.


    Batch 28 needs four further F107 chapters this claim does not cover: operational
    risk model granularity, validation and ongoing monitoring; pricing an option
    under risk-neutral valuation and the dynamic hedging mechanism a bank runs against
    a written option position; options used to hedge downside risk while keeping
    upside exposure; and benchmarking a bank's capital ratios against comparable
    banks.


    Batch 29 needs six further F107 sections, all distinct from the existing claim's
    scope: module 7.9 (a bank's own staff pension fund's market risk overview, its
    obligation-risk quantification, and the impact of pension risk on bank capital),
    module 1.12 (pension obligation risk and political risk), and module 7.8 (the
    impact of post-crisis trading regulation on bank hedging and trading activity).
    political-risk also anchors to ifoa.sp9.3.2-1; represented here under its first-listed
    anchor per the ledger-04.yaml precedent for multi-anchor nodes.


    Batch 30 needs three further F107 chapters: prepayment risk, where a borrower
    repays a loan earlier than scheduled, disrupting the expected interest income
    and reinvestment assumptions built into its pricing (the vault's own IRRBB material
    treats prepayment only as a behavioural modelling input feeding EVE and NII,
    not as a defined risk category with this income and reinvestment framing, so
    it was rejected rather than attached; see report-30.md); price elasticity of
    deposits, how sensitive the volume of deposits a bank attracts or retains is
    to a change in the rate it offers; and why the profit and loss account, rather
    than any single product's margin, is the measure against which a bank ultimately
    judges its overall pricing and profitability.


    Batch 31 needs four further F107 sections beyond the claim already recorded:
    the definition of proprietary trading as a bank trading for its own account
    rather than on a customer's behalf (proprietary-trading-activities); how much
    capital a rating agency expects a bank to hold to retain a given credit rating,
    which can exceed the regulatory minimum (rating-agency-capital-considerations);
    how the practicality of rating a borrower differs across retail, non-retail
    and specialised lending exposures (ratings-by-exposure-type); and the EU regime
    requiring banks to plan their own recovery and giving resolution authorities
    powers to wind down a failing bank without a taxpayer bailout (recovery-and-resolution-eu).
    The vault's UK bank resolution article mentions the EU Bank Recovery and Resolution
    Directive only in one clause on the UK regime's transposition history; it does
    not treat the EU regime itself.


    Batch 32 also wants the F107 unit on regulatory risk as a risk category, the
    risk that a change in regulation or non-compliance harms a bank financially
    or restricts its operations (regulatory-risk, anchor assa.f107.1.12-17, also
    anchored to ifoa.sp9.3.2-1).

    Also wants, as a partial-coverage remainder, the F107 definition of regulatory
    capital as distinct from a bank's own economic-capital assessment (regulatory-capital,
    anchor assa.f107.1.10-1). The vault's regulation/crr is attached to this node:
    it treats the EU/UK own-funds and capital-adequacy regime in depth, which is
    the "capital a bank is required to hold" half of the node, but does not draw
    the contrast against economic capital that F107 itself would state and that
    the node's own body names.


    Batch 33 needs six further F107 chapters from this same study material: residual
    risk as a credit risk mitigant concept (section 1.12-13; residual-risk also
    carries ifoa.sp9.6.2-3 as a second anchor, named here rather than opened as
    a second entry); retail and commercial bank products (4.1); retail banking activities
    (1.6-1); qualitative factors in retail credit risk assessment (6.1-1-1); retail
    loan pricing using a standard rate structure for a homogeneous population (5.3-1);
    and the general bank-pricing-structures framework behind risk-based loan pricing
    (5.1-2; the attached vault article concepts/economic-value-of-rating-systems
    covers the PD-based spread mechanism but not this framework, and risk-based-pricing
    also carries assa.f207.1.12-1 as a second anchor, named here rather than opened
    as a second entry). risk-correlation-aggregation is ledgered here under the
    first-listed anchor rule (assa.f107.3.3-3) even though the attached vault article
    methods/default-correlation-copula-models already serves that half; the remaining
    gap is the general cross-risk-type correlation and diversification treatment
    at the node's second anchor, ifoa.sp9.4.2-1.


    Batch 34 needs three different parts of F107, none of them the existing claim's
    AML/advisory/alternative-bank scope. risk-diversification (module 3.3-1) is
    attached to regulation/eba-retail-diversification for the borrower/counterparty-granularity
    half of diversification (CRR Article 123's no-single-counterparty-above-0.2%
    condition); F107 is still needed for the sector and risk-type halves the node
    also names, which no vault article treats. risk-neutral-pricing (module 5.5-4-1)
    needs F107's own treatment of pricing a derivative as a discounted risk-neutral
    expectation; the vault's xVA and CVA articles use risk-neutral valuation instrumentally
    within counterparty-risk pricing and never teach the measure itself. risk-weighted-assets
    (module 1.10-4) is attached to regulation/eu-crr-2013-credit-risk for the risk-weighting
    mechanism; F107 is still needed for the explicit "denominator against which
    capital ratios are measured" framing, which the attached article implies (risk
    weights feed Part Three's capital requirements) but never states in those terms.


    Batch 35 needs chapter 10.1, the sources of bank liquidity under stress and
    the 1-week and 1-month liquidity ratios, a different chapter from the recorded
    AML and advisory-pricing claim.


    Batch 36 needs two further F107 chapters: using statistical models of a loan
    portfolio's behaviour, rather than exposure-by-exposure judgement, to manage
    its composition and performance; and comparing the capital buffer a bank's own
    stress test implies it needs against the combined capital conservation and countercyclical
    buffers regulation already requires. No vault article was found making that
    comparison: the vault's countercyclical-capital-buffer and PRA capital-buffers
    articles describe the CCyB and CCoB in isolation, never against a stress-test-
    implied figure.


    Batch 37 needs nine further F107 sections beyond the AML/M&A/alternative-bank
    claim already recorded, two of them completing a partial vault attach rather
    than opening a fresh gap. A worked example projecting a bank's cash outflows
    under the LCR's prescribed stress assumptions (stressed-outflow-report, 10.4-2-3):
    the vault's bcbs-liquidity-risk-principles-evolution article is attached for
    the general stress scenario framework, but not for a worked, quantified report.
    The choice between a closed-form approximation and a Monte Carlo simulation
    when pricing off a market-implied survival curve (survival-curve-model-comparison,
    6.3-5-2). The counterparty credit risk a bank runs on interest rate and currency
    swaps and exotic trading-book derivatives (swaps-and-exotic-trading-exposures,
    6.3-2). Swaps as a contract exchanging cashflow streams, used to change risk
    exposure without closing the underlying position (swaps-hedging, 7.5-4-3). The
    general definition of systemic risk, the failure of one bank or a common shock
    propagating through the banking system as a whole (systemic-risk, 1.12-3; also
    ifoa.cb2.3.8-4): the vault's bcbs-banks-nbfi-interconnections-systemic-risk
    article is attached for one propagation channel (bank-NBFI interconnections),
    not the general concept. Tail value at risk as the expected loss conditional
    on exceeding a given quantile of the loss distribution (tail-value-at-risk,
    7.7-3; also ifoa.cm2.2.1-1 and ifoa.sp9.5.1-2): the vault's frtb-minimum-capital-market-risk
    article is attached for expected shortfall's regulatory use, not the formal
    conditional-expectation definition. The risk that a failure or inadequacy in
    a bank's technology systems disrupts its operations or exposes it to loss (technology-risk,
    1.12-20). The extra return a saver demands for committing funds for a longer
    term (term-liquidity-premium, 5.2-3; also assa.f207.4.4-1, 4.4-2, 4.4-6, 4.4-7
    and 4.5-5, ledgered here as F107 is first-listed). And the full layered structure
    running from supra-national standard-setters to the national authorities that
    transpose and enforce their standards (supra-national-and-national-regulators,
    2.5-1): the vault's basel-accord-evolution article is attached for one worked
    example of that transposition (BCBS to EU/UK), not a general treatment of the
    layering itself.


    Batch 38 needs three further parts of F107 beyond the seeded claim's AML and
    advisory- pricing ground: Unit 1.7 for trading income from trading-book positions
    (trading-income), Unit 5.5 for how transactional products such as FX and payments
    are priced on volume and margin rather than risk-based capital (transactional-product-
    pricing), and Unit 2.5 for the twin peaks split between prudential and conduct
    supervision (twin-peaks-regulation), which also anchors to IFoA CP1.2.1-1.


    Extends the existing needed_by with five further F107 topics: the universal-bank
    and wholesale-funded-bank business models, wholesale market funding, why a bank
    holds capital, and the yield-curve section (7.1) that value-at-risk (section
    7.5) also sits in. value-at-risk carries four further anchors (ifoa.cm2.2.1-1,
    ifoa.sp5.7.7-1, ifoa.sp6.4.4-3, ifoa.sp9.5.1-1) and yield-curves carries one
    further anchor (ifoa.sp6.3.6-1-1), none separately ledgered.
