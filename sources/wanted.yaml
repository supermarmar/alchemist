    distribution and commission); it was rejected for both as a market-conduct investigation
    with no findings yet published, not the syllabus's channel taxonomy or pricing-considerations
    content, and not scoped to health and care specifically.


    Batch 18 needs six different SP1 chapters from this document, none of them the
    pricing/reserving-assumptions chapter the seeded claim describes: health and
    care product design principles and merits comparison (weighing designs against
    stakeholder objectives), the regulatory and tax regime that shapes product design,
    risk mitigation actions beyond reinsurance and underwriting (claims management,
    data checks, distributor and counterparty management), the health cash plan
    product definition, and income protection insurance's benefit mechanic.


    Batch 20 needs sections 3.1-4, the risk that the return earned on the assets
    backing a health and care insurer's liabilities falls short of, or behaves differently
    from, what was assumed, distinct from the assumption-setting material the existing
    claim names.


    This batch's two nodes need a different part of SP1 than the existing claim:
    legal, regulatory and tax risk as a category of risk a health and care insurer
    carries on business already written, and the grouping of a health and care insurer's
    liabilities by guarantee type or valuation certainty for asset-liability matching
    purposes. Neither is stated in the claim above, which concerns pricing, reserving
    and embedded value assumptions.


    Batch 23 needs a different SP1 chapter: what long-term care insurance funds
    and how activities-of-daily-living triggers work (long-term-care-insurance,
    SP1 1.1-3).


    Batch 24 needs SP1's product-description chapter (1.1, major medical expenses
    insurance as a health and care product) and its risk-register chapter (3.1,
    management action risk), distinct from the pricing and reserving claim above.


    Batch 26 needs two further SP1 chapters: the multi-state model as used for sickness
    and health contracts (shared with the CS2 anchor above), and new business risk,
    where the volume or mix of policies sold departs from the business plan.


    Batch 28's passive-and-active-valuation-approaches node anchors to SP1 chapter
    4.4 (and carries a second anchor at ifoa.sp2.4.4-3, not separately ledgered
    per the brief's multi-anchor rule) rather than the pricing-and-reserving-assumption
    ground this claim covers, and needs the distinction between valuing assets and
    liabilities on a fixed basis regardless of market movements and revaluing them
    as market conditions change.


    Batch 29 needs two items from SP1 module 3.1, distinct from the existing claim's
    assumption-setting scope: item 6, persistency risk (policyholders lapsing, surrendering
    or ceasing premiums at a different rate than priced for), and item 17, physical
    risk (physical damage to the insurer's own premises, systems or people disrupting
    its ability to operate). persistency-risk also anchors to ifoa.sp2.3.1 and ifoa.sp2.3.5;
    represented here under its first-listed anchor per the ledger-04.yaml precedent
    for multi-anchor nodes.


    Batch 30 needs two further SP1 chapters: how a pricing assumption, chosen to
    be realistic so the product remains competitive, and a supervisory reserving
    assumption, chosen more prudently, come to differ for the same risk (shared
    with the SP2 anchor below); and private medical insurance, reimbursing the cost
    of private diagnosis and treatment for acute conditions rather than only catastrophic
    ones. Pricing-versus-reserving-assumption-differences also carries a third anchor
    (ifoa.sp2.5.1-3) not ledgered separately, since SP1 is the first-listed anchor
    body.


    Batch 32 also wants three further SP1 units: the cost, counterparty-strength
    and retention considerations that determine how much of its health and care
    risk an insurer reinsures (reinsurance-programme-choice, anchor ifoa.sp1.3.2-3,
    also anchored to ifoa.sp2.3.2-3 and ifoa.sp7.5.3); reputational risk (anchor
    ifoa.sp1.3.1-15, also anchored to ifoa.sp9.3.2-1); and the interplay between
    a health and care insurer's reserve and its capital (reserve-capital-interplay,
    anchor ifoa.sp1.4.4-2, also anchored to ifoa.sp2.4.4-2).

    Also wants, as a partial-coverage remainder, the health-and-care-specific half
    of why different reinsurance structures suit different risk profiles (reinsurance-structure-appropriateness,
    anchor ifoa.sp1.3.2-2, also anchored to ifoa.sp7.5.4). The vault's concepts/reinsurance
    is attached to this node: it states which structure suits which risk profile
    in general terms (quota share for a homogeneous book, facultative for a large
    or unusual risk), but its worked examples are general-insurance (motor, household),
    not health and care.


    Batch 35 needs chapter 4.3-3, projecting a health and care insurer's future
    solvency position under a business plan, adjacent to the embedded-value-projection
    content the recorded claim already names.


    Batch 36 needs five further SP1 chapters: the aims a State sets for its own
    healthcare provision, such as universal access or a defined minimum standard
    of care; the mechanisms by which a State delivers on those objectives, such
    as direct provision, mandatory social insurance or subsidised private cover;
    how a State finances that provision, whether through general taxation, ring-fenced
    social insurance or a mix of the two; the distinction between a statistical
    reserve estimate derived from portfolio experience and an individual case estimate
    set claim by claim; and the general distinction between a deterministic model
    running one set of assumptions to a single result and a stochastic model running
    many simulated sets to show a range of outcomes. Stochastic versus deterministic
    modelling carries two further anchor bodies (ifoa.sp2.4.1-2, ifoa.sp9.4.8-3),
