# Builds the corpus, runs every check and the test suite, then publishes the
# result to GitHub Pages.
#
# Check before build, deliberately. Check 7 compares the committed
# `notation/symbols.md` against what `objects.yaml` would generate, so building
# first regenerated the very file the check was about to inspect and rule 7
# could not fail in CI at all. Checking first is what turns it into a gate.
#
# The freshness argument for building here at all survives the reorder, because
# assembly copies the rebuilt files rather than the committed ones. `index.html`
# is generated and committed for github.com readability and no rule guards it,
# so a stale committed index would otherwise publish unnoticed; rebuilding
# before assembly also covers a commit made with the hook bypassed
# (`git commit --no-verify`) or on a clone that never ran
# `git config core.hooksPath .githooks`.
#
# `requirements.txt` is deliberately not installed here. It is the full ML
# stack (torch, polars, scikit-learn and the rest) carried over from
# `actuarial_deep_learning` for lectures that execute Python against the
# Bondora parquets, and none of `build_site.py`, `check.py` or the unit suite
# touches it: the render-chain tests that do (`tests/test_render_chain.py`)
# skip cleanly wherever Quarto or Chrome are absent, which is always true on
# this runner. Installing it here would slow every push for no verification
# gained.
#
# The `Assemble the site` step is an allow-list: everything it does not name
# stays off the site, in particular `notes/`, the `.qmd` sources,
# `sources/wanted.yaml` and `scripts/` itself. See CLAUDE.md's public-repo
# rules for what that does and does not buy on a repo that is public
# regardless.

name: Deploy corpus site to Pages

on:
  push:
    branches: [main]
    paths:
      - nodes/**
      - paths/**
      - notation/objects.yaml
      - sources/wanted.yaml
      - lectures/**
      - assets/**
      - vendor/katex/**
      - scripts/**
      - index.html
      - requirements-dev.txt
      - .python-version
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. In-progress runs finish rather than cancel, since a
# cancelled deploy can leave the site half-written.
#
# Re-running only the failed job of a run that both uploaded and deployed
# produces a second artefact named `github-pages`, which `deploy-pages` then
# refuses to choose between. Dispatch a fresh run instead of using the
# "re-run failed jobs" button on this workflow.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Create the virtual environment
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements-dev.txt

      - name: Install graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Run the ten checks
        run: .venv/bin/python scripts/check.py

      - name: Build the site
        run: .venv/bin/python scripts/build_site.py

      - name: Run the test suite
        run: .venv/bin/python -m pytest

      - name: Assemble the site
        run: |
          set -euo pipefail
          shopt -s nullglob

          # A directory separate from the repo's own `site/` (which holds only
          # the generated node pages, path pages and graph SVGs), because the
          # generated pages' relative links assume the repo-root layout two
          # levels up: `site/nodes/<id>.html` links `../../assets/lecture.css`.
          # `_pages/` reproduces that layout one level down, so nothing in
          # `site.py` needs to know it is being published rather than browsed
          # from a checkout.
          mkdir -p _pages/vendor _pages/notation _pages/lectures

          cp index.html _pages/
          cp -R site _pages/site
          cp -R assets _pages/assets
          cp notation/symbols.md _pages/notation/
          cp -R vendor/katex _pages/vendor/katex

          # lectures/*.html and its PDF are committed (Task 14: rebuilding
          # them needs Quarto, the modelling stack and gitignored parquet
          # extracts this job does not have). `|| true` on all three lines is
          # the defensive fallback for a lecture not yet rendered: under
          # `shopt -s nullglob` an empty glob leaves `cp` holding its
          # destination alone, which is a usage error and fails the job under
          # `set -e`. `lectures/figures` need not exist either. Only the HTML
          # line carried the guard.
          cp lectures/*.html _pages/lectures/ || true
          cp lectures/*.pdf _pages/lectures/ || true
          cp -R lectures/figures _pages/lectures/figures || true

          # Belt-and-braces against Jekyll processing on a future switch to
          # branch-based publishing; the Actions deployment below does not run
          # Jekyll itself. include-hidden-files below is what actually carries
          # this file into the artefact.
          touch _pages/.nojekyll

          echo "Published files:"
          find _pages -type f | sort

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _pages
          # upload-pages-artifact excludes hidden files by default, which
          # would silently drop _pages/.nojekyll otherwise.
          include-hidden-files: true

      - id: deployment
        uses: actions/deploy-pages@v4
