id: financial-engineering
title: Financial engineering
builds_on: [maths-stats-prerequisites]
preamble: >
  Financial engineering from stochastic calculus and arbitrage-free pricing
  through option and asset-liability models to the instruments a trading or
  treasury desk runs day to day. It assumes the mathematics and statistics path
  outright, though Ito's lemma and the stochastic differential equation it
  governs sit here rather than there, because the only dependant either one has
  is the option-pricing machinery this path exists to teach.
