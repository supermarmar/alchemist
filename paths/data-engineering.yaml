id: data-engineering
title: Data engineering
builds_on: [maths-stats-prerequisites]
preamble: >
  Data engineering for the pipelines that feed every other path: data
  provenance, quality and governance, the analysis lifecycle a dataset goes
  through before a model sees it, and the software practices that keep that
  transformation reproducible. It assumes the mathematics and statistics path
  outright, though iteratively reweighted least squares and the generalised
  linear model it fits sit here rather than there, because the one node in this
  path that needs them is a fitting-software topic rather than a modelling one.
