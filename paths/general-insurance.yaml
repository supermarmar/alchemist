id: general-insurance
title: General insurance
builds_on: [maths-stats-prerequisites]
preamble: >
  General insurance from exposure and claims analysis through the reserving
  methods a run-off triangle supports, reinsurance structures and
  adjustment-coefficient ruin theory, into the capital questions a Solvency II
  or equivalent regime asks of the resulting book. It assumes the mathematics
  and statistics path outright, and no root reappears here.
