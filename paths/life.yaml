id: life
title: Life insurance and life contingencies
builds_on: [maths-stats-prerequisites]
preamble: >
  Life insurance from the actuary's own foundations, the life table and the
  future lifetime as a random variable, through mortality investigation,
  graduation and multiple-state modelling, into the with-profits, unit-linked
  and annuity product questions a life office asks of its own book. It assumes
  the mathematics and statistics path outright and restates none of it.
