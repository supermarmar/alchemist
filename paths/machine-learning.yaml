id: machine-learning
title: Machine learning
builds_on: [maths-stats-prerequisites]
preamble: >
  Machine learning as the credit, general-insurance and life actuary now meets
  it: the bias-variance tradeoff and regularisation, tree ensembles and gradient
  boosting, attention and the neural architectures built on it, and the
  calibration and governance questions a regulated model still has to answer
  once it leaves a research notebook. It assumes the mathematics and statistics
  path outright and adds nothing that already lives there.
