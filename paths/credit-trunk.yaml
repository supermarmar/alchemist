id: credit-trunk
title: Credit risk, with life and general insurance alongside
builds_on: [maths-stats-prerequisites, machine-learning]
preamble: >
  The trunk of the corpus: credit risk from the definitions a portfolio manager
  states without a model through to internal ratings-based parameter estimation,
  capital requirements and the governance a regulator expects around them. It
  assumes the mathematics and statistics path and the machine-learning path
  outright, because the trunk runs through auto-calibration, deep survival
  modelling and gradient-boosted scorecards on its way to capital, and restating
  either set of roots here would duplicate a hundred nodes for no reader's
  benefit.
